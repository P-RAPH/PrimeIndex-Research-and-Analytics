<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PrimeIndex Admin</title><meta name="robots" content="noindex">
<style>body{font:15px/1.5 system-ui,sans-serif;margin:0;background:#f5f9fc;color:#14263a}header{background:#0b2540;color:#fff;padding:14px 20px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}header b{margin-right:auto}button,input,select,textarea{font:inherit;padding:8px 10px;border:1px solid #c9d7e2;border-radius:8px}button{background:#14406b;color:#fff;border:0;cursor:pointer}button.g{background:#fca60b;color:#1c1400}main{padding:20px;max-width:1200px;margin:auto;overflow:auto}table{width:100%;border-collapse:collapse;background:#fff}td,th{padding:9px;border-bottom:1px solid #e2eaf0;text-align:left;vertical-align:top}.c{max-width:360px;margin:80px auto;background:#fff;padding:28px;border-radius:14px}.c input{width:100%;margin:6px 0 14px}#m{color:#c0392b}</style></head><body>
<div id="app"><div class="c"><h2>PrimeIndex admin</h2><input id="e" type="email" placeholder="Email" autocomplete="username"><input id="p" type="password" placeholder="Password" autocomplete="current-password"><button onclick="login()">Sign in</button><p id="m"></p></div></div>
<script>
const ST=['New Request','Under Review','Awaiting Clarification','Quotation Sent','Awaiting Client Confirmation','In Progress','Awaiting Client Feedback','Completed','Closed','Cancelled'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=(t,o)=>fetch('/api/admin/'+t,o).then(r=>{if(r.status===401)location.reload();return r.json()});
const js=(m,b)=>({method:m,headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
async function login(){const r=await fetch('/api/login',js('POST',{email:e.value,password:p.value}));r.ok?shell():m.textContent='Invalid credentials or too many attempts.'}
function shell(){document.getElementById('app').innerHTML='<header><b>PrimeIndex admin</b>'+['requests','enquiries','subscribers','posts','media','audit'].map(t=>`<button onclick="show('${t}')">${t}</button>`).join('')+'<a href="/api/admin/export"><button class="g">Export CSV</button></a></header><main id="v"></main>';show('requests')}
async function show(t){const v=document.getElementById('v'),d=await api(t);if(!Array.isArray(d))return v.textContent='Could not load.';
const D=x=>new Date(x).toLocaleString(),E=esc;let h='';
if(!d.length&&t!=='posts'&&t!=='media'){v.innerHTML='<p>Nothing here yet.</p>';return}
if(t==='requests')h=`<table><tr><th>Ref</th><th>Client</th><th>Request</th><th>Status</th><th>Quote / notes</th></tr>${d.map(r=>`<tr><td><b>${E(r.ref)}</b><br>${D(r.createdAt)}</td><td>${E(r.name)}<br>${E(r.email)}<br>${E(r.phone)}<br>${E(r.org)}</td><td>${E(r.service)}<br><i>${E(r.title)}</i><br>Due ${E(r.deadline)}<br>${E(r.description)}<br>${r.files.map(f=>`<a href="${E(f.url)}" target="_blank" rel="noopener">${E(f.name)}</a>`).join('<br>')}</td><td><select id="s${r.id}">${ST.map(s=>`<option${s===r.status?' selected':''}>${s}</option>`).join('')}</select><br><label><input type="checkbox" id="n${r.id}"> email client</label></td><td><input id="q${r.id}" value="${E(r.quote)}" placeholder="Quotation"><br><textarea id="t${r.id}" placeholder="Internal notes">${E(r.notes)}</textarea><br><button onclick="up('${r.id}')">Save</button></td></tr>`).join('')}</table>`;
else if(t==='enquiries')h=`<table>${d.map(x=>`<tr><td>${D(x.createdAt)}</td><td>${E(x.name)}<br>${E(x.email)}</td><td><b>${E(x.subject)}</b><br>${E(x.message)}</td></tr>`).join('')}</table>`;
else if(t==='subscribers')h=`<table>${d.map(x=>`<tr><td>${E(x.email)}</td><td>${x.confirmed?'Confirmed':'Pending'}</td><td><button onclick="del('subscribers','${x.id}')">Delete</button></td></tr>`).join('')}</table>`;
else if(t==='audit')h=`<table>${d.map(x=>`<tr><td>${D(x.createdAt)}</td><td>${E(x.action)}</td><td>${E(x.detail)}</td></tr>`).join('')}</table>`;
else if(t==='posts')h=`<h3>New article</h3><input id="pt" placeholder="Title"> <input id="pc" placeholder="Category"> <input id="pd" type="datetime-local"><br><textarea id="pb" rows="6" style="width:100%;margin:8px 0" placeholder="Body"></textarea><label><input type="checkbox" id="pp"> Publish</label> <button onclick="mk()">Save article</button><table>${d.map(x=>`<tr><td>${E(x.title)}</td><td>${x.published?'Published':'Draft'}</td><td><button onclick="del('posts','${x.id}')">Delete</button></td></tr>`).join('')}</table>`;
else if(t==='media')h=`<input type="file" id="mf"> <button onclick="upm()">Upload</button><table>${d.map(x=>`<tr><td>${E(x.name)}</td><td><a href="${E(x.url)}" target="_blank" rel="noopener">${E(x.url)}</a></td><td><button onclick="del('media','${x.id}')">Delete</button></td></tr>`).join('')}</table>`;
v.innerHTML=h}
async function up(id){await api('requests',js('PATCH',{id,status:document.getElementById('s'+id).value,quote:document.getElementById('q'+id).value,notes:document.getElementById('t'+id).value,notify:document.getElementById('n'+id).checked}));alert('Saved')}
async function del(t,id){if(confirm('Delete permanently?')){await api(t,js('DELETE',{id}));show(t)}}
async function mk(){await api('posts',js('POST',{title:pt.value,category:pc.value,body:pb.value,published:pp.checked,publishAt:pd.value||null}));show('posts')}
async function upm(){const f=new FormData();f.append('file',mf.files[0]);await api('media',{method:'POST',body:f});show('media')}
fetch('/api/admin/audit').then(r=>r.ok&&shell());
</script></body></html>
