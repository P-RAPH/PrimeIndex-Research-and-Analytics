<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>PrimeIndex Admin</title><link rel="icon" href="/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,600..700,100&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--n:#14406b;--ink:#0b2540;--t:#2aa7c3;--g:#fca60b;--bg:#f2f6fa;--c:#fff;--tx:#18293b;--mu:#5d7084;--ln:#dde7ef;--ok:#1b9e63;--er:#d64545;--sh:0 8px 30px rgba(11,37,64,.08)}
[data-theme=dark]{--bg:#071a2d;--c:#0e2842;--tx:#e8f0f6;--mu:#9fb2c3;--ln:#1e3d5b;--n:#8fcbe8;--sh:none}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 "Plus Jakarta Sans",system-ui,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-variation-settings:"SOFT" 100;margin:0;color:var(--n)}
button,input,select,textarea{font:inherit;color:inherit}:focus-visible{outline:3px solid var(--g);outline-offset:2px}
.btn{background:var(--n);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer;transition:.15s}[data-theme=dark] .btn{color:#06192b}.btn:hover{transform:translateY(-1px)}.btn.g{background:var(--g);color:#1c1400}.btn.o{background:none;border:1px solid var(--ln);color:var(--tx)}.btn.d{background:var(--er);color:#fff}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--ln);border-radius:10px;background:var(--c)}input:focus,select:focus,textarea:focus{border-color:var(--t);outline:none;box-shadow:0 0 0 4px rgba(42,167,195,.2)}
#login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(900px 500px at 20% 10%,#1d5a93,transparent),var(--ink);padding:20px}
.lc{background:var(--c);border-radius:24px;padding:36px;width:100%;max-width:400px;box-shadow:0 30px 80px rgba(0,0,0,.4);animation:up .5s}.lc img{height:84px;display:block;margin:0 auto 14px}.lc h2{text-align:center;margin-bottom:4px}.lc p{text-align:center;color:var(--mu);margin:0 0 20px}.lc label{display:block;font-weight:600;font-size:13px;margin-bottom:14px}.lc input{margin-top:6px}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
#shell{display:none;min-height:100vh}aside{position:fixed;inset:0 auto 0 0;width:248px;background:var(--ink);color:#cfe0ed;padding:18px 14px;display:flex;flex-direction:column;gap:4px;z-index:20;transition:.25s}
aside .lg{background:#fff;border-radius:14px;padding:8px;margin-bottom:14px;text-align:center}aside .lg img{height:60px}
aside button.nv{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;color:inherit;padding:11px 12px;border-radius:12px;cursor:pointer;font-weight:600;text-align:left}aside button.nv:hover{background:rgba(255,255,255,.07)}aside button.nv.on{background:linear-gradient(90deg,var(--t),#1b7f99);color:#fff}aside .bd{margin-left:auto;background:var(--g);color:#1c1400;border-radius:99px;font-size:12px;padding:1px 8px}
aside .ft{margin-top:auto;display:grid;gap:8px}main{margin-left:248px;padding:26px 30px 60px;max-width:1300px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}.top h1{font-size:30px}.top .sp{margin-left:auto;display:flex;gap:8px}#mb{display:none}
.grid{display:grid;gap:16px}.k{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.card{background:var(--c);border:1px solid var(--ln);border-radius:18px;padding:20px;box-shadow:var(--sh);animation:up .4s both}
.kp{display:flex;gap:14px;align-items:center;cursor:pointer;transition:.2s}.kp:hover{transform:translateY(-3px)}.kp .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:21px;background:rgba(42,167,195,.15)}.kp b{font:700 28px Fraunces,serif;display:block;line-height:1;color:var(--n)}.kp span{color:var(--mu);font-size:13px}
.two{grid-template-columns:1.3fr 1fr}.bar{display:grid;grid-template-columns:150px 1fr 30px;gap:10px;align-items:center;margin:9px 0;font-size:13px}.bar i{display:block;height:10px;border-radius:9px;background:linear-gradient(90deg,var(--t),var(--n));transition:width .8s}.bar div{background:var(--bg);border-radius:9px}
.pill{display:inline-block;border-radius:99px;padding:2px 11px;font-size:12px;font-weight:700;white-space:nowrap}
.tb{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}.tb input{max-width:320px}.tb select{max-width:230px}
.tw{overflow:auto;border-radius:18px;border:1px solid var(--ln);background:var(--c)}table{width:100%;border-collapse:collapse}th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);text-align:left;padding:12px 14px;background:var(--bg)}td{padding:13px 14px;border-top:1px solid var(--ln);vertical-align:top}tr.r{cursor:pointer;transition:.12s}tr.r:hover{background:rgba(42,167,195,.08)}small,.mu{color:var(--mu)}
.empty{text-align:center;padding:50px 20px;color:var(--mu)}.empty b{display:block;font-size:40px}
#dr{position:fixed;inset:0 0 0 auto;width:min(560px,100%);background:var(--c);z-index:40;transform:translateX(105%);transition:.3s;box-shadow:-20px 0 60px rgba(0,0,0,.25);overflow:auto;padding:26px}#dr.on{transform:none}#ov{display:none;position:fixed;inset:0;background:rgba(5,15,30,.5);z-index:30}#ov.on{display:block}
.f{margin:14px 0}.f>label{display:block;font-weight:600;font-size:13px;margin-bottom:6px}.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:14px}.kv dt{color:var(--mu)}.kv dd{margin:0;word-break:break-word}
.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--ln);border-radius:99px;padding:5px 12px;font-size:13px;text-decoration:none;color:inherit;margin:3px 3px 0 0}
.dz{border:2px dashed var(--ln);border-radius:18px;padding:30px;text-align:center;color:var(--mu);cursor:pointer}.dz.h{border-color:var(--t);background:rgba(42,167,195,.08)}
.mg{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}.mi{padding:0;overflow:hidden}.mi .pv{height:120px;background:var(--bg) center/cover;display:grid;place-items:center;font-size:34px}.mi div.b{padding:10px 12px;font-size:13px}.mi .ac{display:flex;gap:6px;margin-top:8px}
#ts{position:fixed;bottom:20px;right:20px;display:grid;gap:8px;z-index:60}.to{background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:up .3s;border-left:4px solid var(--ok)}.to.e{border-color:var(--er)}
@media(max-width:900px){aside{transform:translateX(-100%)}aside.on{transform:none}main{margin:0;padding:18px}#mb{display:inline-block}.two{grid-template-columns:1fr}.bar{grid-template-columns:110px 1fr 26px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="login"><form class="lc" onsubmit="return go(event)"><img src="/logo.png" alt="PrimeIndex"><h2>Welcome back</h2><p>Sign in to the admin console</p><label>Email<input id="em" type="email" autocomplete="username" required></label><label>Password<input id="pw" type="password" autocomplete="current-password" required></label><button class="btn g" style="width:100%;padding:12px" id="lb">Sign in</button><p id="le" style="color:var(--er);margin:12px 0 0"></p></form></div>
<div id="shell"><aside id="sd"><div class="lg"><img src="/logo.png" alt="PrimeIndex"></div><div id="nv"></div><div class="ft"><a href="/api/admin/export" class="btn g" style="text-align:center;text-decoration:none">⬇ Export CSV</a><button class="btn o" style="color:#cfe0ed;border-color:#2c4b68" onclick="th()">◐ Theme</button><button class="btn o" style="color:#cfe0ed;border-color:#2c4b68" onclick="out()">Sign out</button></div></aside>
<main><div class="top"><button class="btn o" id="mb" onclick="sd.classList.toggle('on')">☰</button><h1 id="ti"></h1><div class="sp"><button class="btn o" onclick="load(1)">↻ Refresh</button></div></div><div id="v"></div></main></div>
<div id="ov" onclick="cl()"></div><div id="dr" role="dialog" aria-modal="true"></div><div id="ts" role="status"></div>
<script>
const ST=['New Request','Under Review','Awaiting Clarification','Quotation Sent','Awaiting Client Confirmation','In Progress','Awaiting Client Feedback','Completed','Closed','Cancelled'];
const CL=['#2aa7c3','#8e6bd8','#e08a1e','#14406b','#c9831a','#1b9e63','#d5a017','#12805a','#6b7b8c','#d64545'];
const V={dash:['Dashboard','▦'],requests:['Requests','✉'],enquiries:['Enquiries','💬'],subscribers:['Subscribers','★'],posts:['Articles','✎'],media:['Media','▣'],audit:['Activity log','☰']};
let D={},cur='dash',q='',sf='',lf='';
const $=i=>document.getElementById(i),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dt=x=>new Date(x).toLocaleString([], {dateStyle:'medium',timeStyle:'short'});
const pill=s=>{const c=CL[ST.indexOf(s)]||'#888';return `<span class="pill" style="background:${c}22;color:${c}">${E(s)}</span>`};
const js=(m,b)=>({method:m,headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
async function api(t,o){const r=await fetch('/api/admin/'+t,o);if(r.status===401){show(0);throw 0}return r.json()}
function toast(m,e){const d=document.createElement('div');d.className='to'+(e?' e':'');d.textContent=m;$('ts').appendChild(d);setTimeout(()=>d.remove(),3200)}
function show(on){$('login').style.display=on?'none':'grid';$('shell').style.display=on?'block':'none'}
function th(){const d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'':'dark';try{localStorage.pit=d.dataset.theme}catch{}}
try{if(localStorage.pit)document.documentElement.dataset.theme=localStorage.pit}catch{}
async function go(ev){ev.preventDefault();$('lb').textContent='Signing in…';const r=await fetch('/api/login',js('POST',{email:$('em').value,password:$('pw').value}));$('lb').textContent='Sign in';if(r.ok){await load();show(1)}else $('le').textContent=r.status===429?'Too many attempts. Wait a few minutes.':'Invalid email or password.';return false}
async function out(){await fetch('/api/logout',{method:'POST'});location.reload()}
async function load(m){try{const k=Object.keys(V).slice(1),r=await Promise.all(k.map(t=>api(t)));k.forEach((t,i)=>D[t]=Array.isArray(r[i])?r[i]:[]);nav();view(cur);if(m)toast('Refreshed')}catch{}}
function nav(){const n=D.requests?.filter(r=>r.status==='New Request').length||0;$('nv').innerHTML=Object.entries(V).map(([k,[l,i]])=>`<button class="nv ${k===cur?'on':''}" onclick="cur='${k}';sd.classList.remove('on');nav();view('${k}')"><span>${i}</span>${l}${k==='requests'&&n?`<span class="bd">${n}</span>`:''}</button>`).join('')}
function view(k){cur=k;$('ti').textContent=V[k][0];const h=(k==='dash'?dash:k==='requests'?reqs:k==='enquiries'?enq:k==='subscribers'?subs:k==='posts'?posts:k==='media'?media:audit)();$('v').innerHTML=h;if(k==='dash')setTimeout(()=>document.querySelectorAll('.bar i').forEach(i=>i.style.width=i.dataset.w),50)}
const em=(i,t)=>`<div class="empty"><b>${i}</b>${t}</div>`;
function dash(){const R=D.requests,c=s=>R.filter(r=>s.includes(r.status)).length,h=new Date().getHours(),g=h<12?'Good morning':h<17?'Good afternoon':'Good evening';
const K=[['✉',R.length,'Total requests','requests'],['★',c(['New Request']),'New, awaiting review','requests'],['⚙',c(['In Progress','Awaiting Client Feedback']),'Active projects','requests'],['✔',c(['Completed']),'Completed','requests'],['💬',D.enquiries.length,'Enquiries','enquiries'],['@',D.subscribers.length,'Subscribers','subscribers']];
const mx=Math.max(1,...ST.map(s=>c([s])));
return `<p class="mu" style="margin:-10px 0 18px">${g}. Here is what needs your attention today.</p><div class="grid k">${K.map(x=>`<div class="card kp" onclick="${x[3]==='requests'&&x[2].startsWith('New')?"sf='New Request';":"sf='';"}cur='${x[3]}';nav();view('${x[3]}')"><div class="ic">${x[0]}</div><div><b>${x[1]}</b><span>${x[2]}</span></div></div>`).join('')}</div>
<div class="grid two" style="margin-top:16px"><div class="card"><h3>Requests by status</h3>${R.length?ST.map(s=>`<div class="bar"><span>${s}</span><div><i data-w="${c([s])/mx*100}%" style="width:0"></i></div><b>${c([s])}</b></div>`).join(''):em('📭','No requests yet. They will appear here.')}</div>
<div class="card"><h3>Recent activity</h3>${D.audit.length?D.audit.slice(0,8).map(a=>`<p style="margin:10px 0"><b>${E(a.action)}</b><br><small>${E(a.detail)} · ${dt(a.createdAt)}</small></p>`).join(''):em('🕑','No activity yet.')}</div></div>
<div class="card" style="margin-top:16px"><h3 style="margin-bottom:8px">Latest requests</h3>${R.length?R.slice(0,5).map(r=>`<p style="margin:0;padding:10px 0;border-top:1px solid var(--ln);cursor:pointer" onclick="op('${r.id}')"><b>${E(r.ref)}</b> · ${E(r.name)} ${pill(r.status)}<br><small>${E(r.title)}</small></p>`).join(''):em('📭','Nothing yet.')}</div>`}
function reqs(){const L=D.requests.filter(r=>(!sf||r.status===sf)&&(!q||(r.ref+r.name+r.email+r.title).toLowerCase().includes(q.toLowerCase())));
return `<div class="tb"><input placeholder="Search name, email or reference" value="${E(q)}" oninput="q=this.value;rr()" id="qs"><select onchange="sf=this.value;rr()"><option value="">All statuses</option>${ST.map(s=>`<option${s===sf?' selected':''}>${s}</option>`).join('')}</select></div><div id="rt">${rt(L)}</div>`}
const rt=L=>L.length?`<div class="tw"><table><tr><th>Reference</th><th>Client</th><th>Service</th><th>Status</th><th>Deadline</th></tr>${L.map(r=>`<tr class="r" onclick="op('${r.id}')"><td><b>${E(r.ref)}</b><br><small>${dt(r.createdAt)}</small></td><td>${E(r.name)}<br><small>${E(r.email)}</small></td><td>${E(r.service)}<br><small>${E(r.title)}</small></td><td>${pill(r.status)}</td><td>${E(r.deadline)}</td></tr>`).join('')}</table></div>`:em('🔍','No requests match.');
function rr(){const L=D.requests.filter(r=>(!sf||r.status===sf)&&(!q||(r.ref+r.name+r.email+r.title).toLowerCase().includes(q.toLowerCase())));$('rt').innerHTML=rt(L)}
function op(id){const r=D.requests.find(x=>x.id===id);if(!r)return;$('dr').innerHTML=`<div style="display:flex;align-items:center"><h2>${E(r.ref)}</h2><button class="btn o" style="margin-left:auto" onclick="cl()">✕</button></div><p>${pill(r.status)} <small>${dt(r.createdAt)}</small></p>
<dl class="kv"><dt>Client</dt><dd>${E(r.name)}</dd><dt>Email</dt><dd><a href="mailto:${E(r.email)}">${E(r.email)}</a></dd><dt>Phone</dt><dd><a href="https://wa.me/${E(r.phone.replace(/\D/g,'').replace(/^0/,'234'))}" target="_blank" rel="noopener">${E(r.phone)} (WhatsApp)</a></dd><dt>Institution</dt><dd>${E(r.org)} ${E(r.field)}</dd><dt>Level</dt><dd>${E(r.level)}</dd><dt>Service</dt><dd>${E(r.service)}</dd><dt>Topic</dt><dd>${E(r.title)}</dd><dt>Deadline</dt><dd>${E(r.deadline)}</dd><dt>Tools</dt><dd>${E(r.tools)||'—'}</dd><dt>Budget</dt><dd>${E(r.budget)||'—'}</dd><dt>Contact via</dt><dd>${E(r.via)}</dd><dt>Details</dt><dd style="white-space:pre-wrap">${E(r.description)}</dd></dl>
<div class="f"><label>Attachments</label>${r.files.length?r.files.map(f=>`<a class="chip" href="${E(f.url)}" target="_blank" rel="noopener">📎 ${E(f.name)}</a>`).join(''):'<small>None</small>'}</div><hr style="border:0;border-top:1px solid var(--ln)">
<div class="f"><label>Status</label><select id="ds">${ST.map(s=>`<option${s===r.status?' selected':''}>${s}</option>`).join('')}</select></div><div class="f"><label>Quotation</label><input id="dq" value="${E(r.quote)}" placeholder="e.g. ₦50,000, 5 days"></div><div class="f"><label>Internal notes (private)</label><textarea id="dn" rows="4">${E(r.notes)}</textarea></div>
<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="dm" style="width:auto"> Email the client about this update</label><div style="display:flex;gap:10px;margin-top:18px"><button class="btn g" onclick="sv('${r.id}')">Save changes</button><button class="btn o" onclick="cl()">Close</button></div>`;$('dr').classList.add('on');$('ov').classList.add('on')}
function cl(){$('dr').classList.remove('on');$('ov').classList.remove('on')}
async function sv(id){try{const n=await api('requests',js('PATCH',{id,status:$('ds').value,quote:$('dq').value,notes:$('dn').value,notify:$('dm').checked}));if(n.error)throw 0;const i=D.requests.findIndex(x=>x.id===id);D.requests[i]={...D.requests[i],...n};toast('Saved'+($('dm').checked?' · client emailed':''));cl();nav();view(cur)}catch{toast('Could not save',1)}}
function enq(){return D.enquiries.length?`<div class="tw"><table>${D.enquiries.map(x=>`<tr><td style="width:170px"><small>${dt(x.createdAt)}</small></td><td>${E(x.name)}<br><small><a href="mailto:${E(x.email)}">${E(x.email)}</a> ${E(x.phone)}</small></td><td><b>${E(x.subject)}</b><br>${E(x.message)}</td><td><button class="btn d" onclick="dl('enquiries','${x.id}')">Delete</button></td></tr>`).join('')}</table></div>`:em('💬','No enquiries yet.')}
function subs(){const c=D.subscribers.filter(s=>s.confirmed).map(s=>s.email);return D.subscribers.length?`<div class="tb"><button class="btn" onclick="navigator.clipboard.writeText('${c.join(', ')}');toast('${c.length} confirmed emails copied')">Copy confirmed emails (${c.length})</button></div><div class="tw"><table>${D.subscribers.map(x=>`<tr><td>${E(x.email)}</td><td>${x.confirmed?'<span class="pill" style="background:#1b9e6322;color:#1b9e63">Confirmed</span>':'<span class="pill" style="background:#d5a01722;color:#b8860b">Pending</span>'}</td><td><small>${dt(x.createdAt)}</small></td><td><button class="btn d" onclick="dl('subscribers','${x.id}')">Delete</button></td></tr>`).join('')}</table></div>`:em('★','No subscribers yet.')}
function posts(){return `<div class="card" style="margin-bottom:18px"><h3 style="margin-bottom:12px">Write an article</h3><div class="grid" style="grid-template-columns:2fr 1fr 1fr"><input id="pt" placeholder="Title"><input id="pc" placeholder="Category"><input id="pd" type="datetime-local" title="Publish date (optional)"></div><textarea id="pb" rows="7" style="margin:12px 0" placeholder="Write here…" oninput="$('cc').textContent=this.value.length+' characters'"></textarea><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="pp" style="width:auto"> Publish</label><small id="cc">0 characters</small><button class="btn g" style="margin-left:auto" onclick="mk()">Save article</button></div></div>${D.posts.length?`<div class="tw"><table>${D.posts.map(x=>{const f=new Date(x.publishAt)>new Date();return `<tr><td><b>${E(x.title)}</b><br><small>${E(x.category)} · ${dt(x.publishAt)}</small></td><td>${!x.published?'<span class="pill" style="background:#6b7b8c22;color:#6b7b8c">Draft</span>':f?'<span class="pill" style="background:#e08a1e22;color:#e08a1e">Scheduled</span>':'<span class="pill" style="background:#1b9e6322;color:#1b9e63">Published</span>'}</td><td><button class="btn d" onclick="dl('posts','${x.id}')">Delete</button></td></tr>`}).join('')}</table></div>`:em('✎','No articles yet.')}`}
async function mk(){if(!$('pt').value.trim()||!$('pb').value.trim())return toast('Add a title and body',1);try{await api('posts',js('POST',{title:$('pt').value,category:$('pc').value,body:$('pb').value,published:$('pp').checked,publishAt:$('pd').value||null}));toast('Article saved');load()}catch{toast('Could not save',1)}}
function media(){return `<div class="dz" id="dz" onclick="$('mf').click()">⬆ Drop files here or click to upload<input type="file" id="mf" hidden multiple onchange="up(this.files)"></div><div class="grid mg" style="margin-top:18px">${D.media.map(m=>`<div class="card mi"><div class="pv" style="${/\.(png|jpe?g|gif|webp|svg)/i.test(m.url)?`background-image:url('${E(m.url)}')`:''}">${/\.(png|jpe?g|gif|webp|svg)/i.test(m.url)?'':'📄'}</div><div class="b"><b>${E(m.name)}</b><div class="ac"><button class="btn o" onclick="navigator.clipboard.writeText('${E(m.url)}');toast('Link copied')">Copy link</button><button class="btn d" onclick="dl('media','${m.id}')">✕</button></div></div></div>`).join('')}</div>${D.media.length?'':em('▣','No media yet.')}`}
async function up(fs){for(const f of fs){const b=new FormData();b.append('file',f);try{await api('media',{method:'POST',body:b});toast('Uploaded '+f.name)}catch{toast('Upload failed: '+f.name,1)}}load()}
function audit(){return D.audit.length?`<div class="tw"><table>${D.audit.map(a=>`<tr><td style="width:190px"><small>${dt(a.createdAt)}</small></td><td><b>${E(a.action)}</b></td><td>${E(a.detail)}</td></tr>`).join('')}</table></div>`:em('☰','No activity yet.')}
async function dl(t,id){if(!confirm('Delete permanently? This cannot be undone.'))return;try{await api(t,js('DELETE',{id}));toast('Deleted');load()}catch{toast('Could not delete',1)}}
document.addEventListener('dragover',e=>{if($('dz')&&e.target.closest('#dz')){e.preventDefault();$('dz').classList.add('h')}});document.addEventListener('dragleave',()=>$('dz')?.classList.remove('h'));document.addEventListener('drop',e=>{if($('dz')&&e.target.closest('#dz')){e.preventDefault();up(e.dataTransfer.files)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')cl()});
