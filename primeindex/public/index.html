<style>
:root{--navy:#14406b;--ink:#0b2540;--teal:#2aa7c3;--teal-d:#12708a;--gold:#fca60b;--bg:#f5f9fc;--card:#fff;--tx:#1a2b3c;--mu:#52667a;--ln:#d9e4ec;--hero:#0b2540;
--serif:"Fraunces",Georgia,serif;--sans:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}html{scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--tx);font:16.5px/1.65 var(--sans)}
h1,h2,h3{font-family:var(--serif);font-variation-settings:"SOFT" 100,"WONK" 1;letter-spacing:-.01em;line-height:1.12;margin:0 0 .5em;color:var(--navy)}
a{color:inherit}.w{max-width:1160px;margin:0 auto;padding:0 22px}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:4px}
header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln);padding-top:env(safe-area-inset-top,0px)}
header .w{display:flex;align-items:center;gap:18px;height:72px}
.brand img{height:56px;display:block;background:#fff;border-radius:8px}
nav{margin-left:auto;display:flex;align-items:center;gap:6px;font-weight:600;font-size:15px}
nav>a,nav .dd>button{padding:10px 12px;border-radius:8px;text-decoration:none;background:none;border:0;color:inherit;font:inherit;cursor:pointer}
nav>a:hover,nav .dd>button:hover{background:color-mix(in srgb,var(--teal) 14%,transparent)}
nav a[aria-current]{color:var(--teal-d);box-shadow:inset 0 -3px 0 var(--gold)}
.dd{position:relative}.menu{display:none;position:absolute;top:100%;left:0;min-width:300px;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:8px;box-shadow:0 18px 40px rgba(11,37,64,.18)}
.dd:hover .menu,.dd:focus-within .menu{display:block}.menu a{display:block;padding:10px 12px;border-radius:8px;text-decoration:none;font-weight:600}.menu a small{display:block;color:var(--mu);font-weight:400}.menu a:hover{background:color-mix(in srgb,var(--teal) 14%,transparent)}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--gold);color:#1c1400;font:700 15px var(--sans);padding:13px 22px;border-radius:999px;text-decoration:none;border:0;cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(252,166,11,.35)}.btn.o{background:none;border:1.5px solid currentColor;color:inherit}.btn[disabled]{opacity:.6;cursor:wait}
#mt{display:none;margin-left:auto;background:none;border:1px solid var(--ln);color:var(--tx);padding:9px 14px;border-radius:999px;font:600 14px var(--sans)}
.hero{background:var(--hero);color:#fff;position:relative;padding:76px 0 120px}
.hero h1{color:#fff;font-size:clamp(38px,6vw,68px);font-weight:700;max-width:12ch}
.hero p{font-size:19px;color:#fff;max-width:520px}.hero .g{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.badge{position:relative;max-width:430px;margin:auto}.badge .lg{width:78%;display:block;margin:11% auto;background:#fff;border-radius:50%;padding:6%;aspect-ratio:1;object-fit:contain}
.badge svg{position:absolute;inset:0;width:100%;overflow:visible}.badge text{font:600 15px var(--serif);fill:var(--gold);letter-spacing:.35em}
.wave{position:absolute;left:0;right:0;bottom:-1px;height:70px;width:100%;display:block}
.page-h{background:var(--hero);color:#fff;padding:56px 0 90px;position:relative}.page-h h1{color:#fff;font-size:clamp(32px,4.6vw,52px);max-width:20ch}.page-h p{max-width:620px;color:#fff;font-size:18px;margin:0}
section{padding:68px 0}.lead{color:var(--mu);max-width:640px;font-size:18px}
.flips{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:22px}
.flip{perspective:1100px;height:300px}.fi{position:relative;height:100%;transition:transform .7s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.flip:hover .fi,.flip:focus-within .fi,.flip.on .fi{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:26px;display:flex;flex-direction:column}
.front{background:var(--card);border:1px solid var(--ln)}.front h3{font-size:25px}.front p{color:var(--mu);margin:0}.front .hint{margin-top:auto;font-size:13px;font-weight:600;color:var(--teal-d)}
.back{background:var(--navy);color:#eaf4fa;transform:rotateY(180deg)}
.back ul{margin:0 0 14px;padding-left:18px;font-size:14.5px}.back .btn{margin-top:auto;align-self:flex-start;padding:10px 18px;font-size:14px}
.ic{width:46px;height:46px;border-radius:14px;background:color-mix(in srgb,var(--teal) 18%,transparent);display:grid;place-items:center;margin-bottom:14px;color:var(--teal-d)}.ic svg{width:24px;height:24px}
.pt{font-size:19px;margin:0 0 14px;color:#fff}.pt b{color:#fff}.cta{margin-top:28px;background:var(--hero);color:#fff;border-radius:28px;padding:44px;display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap}.cta h2{color:#fff;margin:0;font-size:clamp(26px,4vw,40px)}.lead{font-size:20px}
.sp{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:start}.card{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:28px}
.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:grid;gap:14px}.steps li{counter-increment:s;display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start}
.steps li:before{content:counter(s);width:44px;height:44px;border-radius:50%;background:var(--navy);color:var(--bg);display:grid;place-items:center;font:700 18px var(--serif)}.steps b{display:block;color:var(--navy)}
.note{border-left:4px solid var(--gold);background:var(--card);padding:14px 18px;border-radius:0 12px 12px 0;color:var(--mu);font-size:15px}
.dark{background:var(--hero);color:#fff}.dark h2{color:#fff}
.empty{border:2px dashed var(--ln);border-radius:18px;padding:40px;text-align:center;color:var(--mu)}
form label{display:block;font-weight:600;font-size:14px;margin:0 0 16px}
input,select,textarea{display:block;width:100%;margin-top:6px;padding:12px 14px;font:16px var(--sans);border:1.5px solid var(--ln);border-radius:12px;background:var(--card);color:var(--tx)}
input:focus,select:focus,textarea:focus{border-color:var(--teal);outline:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--teal) 25%,transparent)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.chk{display:flex!important;gap:10px;align-items:flex-start;font-weight:400!important}.chk input{width:20px;margin:3px 0 0}
.err{color:#c0392b;font-size:13px;min-height:1em;margin-top:4px}.ok{background:var(--card);border:2px solid var(--teal);border-radius:18px;padding:30px;text-align:center}.ref{font:700 30px var(--serif);color:var(--navy);letter-spacing:.04em}
details{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:16px 20px;margin-bottom:10px}summary{cursor:pointer;font-weight:600}details p{color:var(--mu);margin:10px 0 0}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:10px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}
footer{background:var(--hero);color:#fff;padding:44px 0 calc(40px + env(safe-area-inset-bottom,0px));font-size:14px}footer .w{display:grid;grid-template-columns:2fr 1fr 1fr;gap:28px}footer a{display:block;text-decoration:none;padding:3px 0}footer h4{color:#fff;margin:0 0 8px;font-family:var(--serif)}
.wa{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#1fa855;color:#fff;font-weight:700;padding:13px 18px;border-radius:999px;text-decoration:none;box-shadow:0 6px 18px rgba(0,0,0,.3);z-index:50}
@media(max-width:860px){#mt{display:block}nav{display:none;position:absolute;top:100%;left:0;right:0;background:var(--card);flex-direction:column;align-items:stretch;padding:12px 16px;border-bottom:1px solid var(--ln);max-height:80vh;overflow:auto}nav.open{display:flex}.menu{display:block;position:static;box-shadow:none;border:0;padding:0 0 0 12px;min-width:0}.menu small{display:none}
.hero .g,.sp,footer .w,.row{grid-template-columns:1fr}.hero{padding:48px 0 100px}section{padding:48px 0}.badge{max-width:280px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style><style>
.front{background:#14406b!important;border-color:#14406b!important}.front h3,.front p{color:#fff!important}.front .hint{color:var(--gold)!important}.front .ic{background:rgba(255,255,255,.16);color:#fff}.back{background:#0f6f88!important}.back h3,.back li{color:#fff!important}
.flip:hover .face{box-shadow:0 18px 40px rgba(11,37,64,.25)}
.wd{background:#fff!important}.wd h2{color:#14406b}.wd .lead{color:#52667a}
.hw{background:rgba(255,255,255,.07)!important;border-color:rgba(255,255,255,.22)!important;color:#fff!important}.hw .steps b{color:#fff}.hw .steps li:before{background:#fff;color:#000}
.ni{background:var(--ink)!important;color:#fff!important;border-left-color:var(--gold)}.ni b{color:#fff}
footer,footer a,footer h4{color:#fff}
.hero .g>div:first-child{animation:up .8s both}@keyframes up{from{opacity:0;transform:translateY(22px)}}
.photo{aspect-ratio:4/5;max-height:540px;border-radius:30px;overflow:hidden;border:6px solid rgba(255,255,255,.14);box-shadow:0 30px 70px rgba(0,0,0,.4);background:linear-gradient(135deg,#1d5a93,#0b2540);max-width:440px;margin:auto;transition:transform .5s}.photo:hover{transform:scale(1.02) rotate(-.6deg)}.photo img{width:100%;height:100%;object-fit:cover;display:block}
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s,transform .7s}.rv.in{opacity:1;transform:none}
header{box-shadow:0 4px 22px rgba(11,37,64,.06)}.btn:active{transform:scale(.97)}
@media(max-width:860px){.photo{max-width:320px;aspect-ratio:1}}

'/contact':()=>ph('Contact','Remote enquiries welcome.')+`<section><div class="w sp"><div><h2>Reach us</h2><p><b>Office</b><br>Agricola Street, opposite UI Second Gate, Ibadan, Oyo State, Nigeria.</p><p><b>Phone / WhatsApp</b><br><a href="https://wa.me/${WA}">0904 826 7240</a></p><p><b>Email</b><br><a href="mailto:primeindexresearchhub@gmail.com">primeindexresearchhub@gmail.com</a></p><a class="btn o" style="color:var(--navy)" href="https://www.google.com/maps/search/?api=1&query=Agricola+Street+University+of+Ibadan+Second+Gate+Ibadan">Open map</a><h2 style="margin-top:36px">FAQ</h2>${FAQ.map(f=>`<details><summary>${f[0]}</summary><p>${f[1]}</p></details>`).join('')}</div><div class="card" id="cf"><h2 style="font-size:28px">Send a message</h2><form id="ct" novalidate>${fld('name','Full name','text')}${fld('email','Email','email')}${fld('phone','Phone','tel',1)}${fld('subject','Subject','text')}<label>Message<textarea name="message" rows="4"></textarea><div class="err"></div></label><label class="chk"><input type="checkbox" name="consent"> I agree to the privacy notice.</label><div class="err"></div><button class="btn">Send message</button></form></div></div></section>`,
'/request':()=>ph('Request a Service','Tell us about your project. We reply with a quotation.')+`<section><div class="w"><div class="card" id="rf" style="max-width:780px;margin:auto"><form id="rq" novalidate><div class="row">${fld('name','Full name','text')}${fld('email','Email','email')}</div><div class="row">${fld('phone','WhatsApp or phone','tel')}${fld('org','Institution or organisation','text')}</div><div class="row">${fld('field','Department or field','text',1)}<label>Client category<select name="level"><option>Undergraduate</option><option>Postgraduate</option><option>Doctoral</option><option>Professional</option><option>Organisation</option></select></label></div><div class="row"><label>Service category<select name="cat" id="cat">${S.map(s=>`<option value="${s.id}">${s.n}</option>`).join('')}</select></label><label>Specific service<select name="svc" id="svc"></select></label></div>${fld('title','Project title or topic','text')}<label>Requirements<textarea name="desc" rows="4"></textarea><div class="err"></div></label><div class="row">${fld('tools','Software or analysis needs','text',1)}${fld('deadline','Deadline','date')}</div><div class="row"><label>Preferred contact<select name="via"><option>WhatsApp</option><option>Email</option><option>Phone call</option></select></label>${fld('budget','Budget range (optional)','text',1)}</div><label>Attachments (optional: up to 3 files, 4 MB in total)<input type="file" name="files" multiple data-o="1" accept=".pdf,.doc,.docx,.xls,.xlsx,.csv,.sav,.pptx,.png,.jpg,.txt"><div class="err"></div></label><input name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px" data-o="1"><label class="chk"><input type="checkbox" name="acc"> The information I supplied is accurate.</label><div class="err"></div><label class="chk"><input type="checkbox" name="consent"> I agree to the privacy notice.</label><div class="err"></div><button class="btn">Submit request</button></form></div></div></section>`,
'/privacy':()=>ph('Privacy notice','How PrimeIndex handles your information.')+`<section><div class="w" style="max-width:760px"><p>We collect the details you submit through our forms (name, contact details, project information and any files) only to respond to your enquiry, prepare quotations and deliver agreed services. We do not sell your information. Files are stored securely and used only for your project. You may ask us to correct or delete your information by emailing primeindexresearchhub@gmail.com. Newsletter subscribers can unsubscribe at any time.</p><div class="note">Draft text: have it reviewed against the Nigeria Data Protection Act 2023 before launch.</div></div></section>`,
'/admin':()=>ph('Staff area','Manage requests.')+`<section><div class="w" id="ad"></div></section>`};
function fld(n,l,t,opt){return `<label>${l}<input name="${n}" type="${t}" ${t==='tel'?'autocomplete="tel"':''} data-o="${opt?1:0}"><div class="err"></div></label>`}
function svcPage(id){const s=S.find(x=>x.id===id);if(!s)return notFound();document.title=s.n+' | PrimeIndex';
return ph(s.n,s.d)+`<section><div class="w sp"><div><h2>Who it is for</h2><p>${s.au}</p><h2>What you receive</h2><ul>${s.dl.map(x=>`<li>${x}</li>`).join('')}</ul><a class="btn" href="#/request?s=${s.id}">Request this service</a></div><div class="card"><h2 style="font-size:26px">Process</h2><ol class="steps">${s.pr.map(x=>`<li><span><b>${x}</b></span></li>`).join('')}</ol><div class="note" style="margin-top:16px">Priced after review.</div></div></div></section>`}
const notFound=()=>ph('Page not found','The page you opened does not exist.')+`<section><div class="w"><a class="btn" href="#/">Go home</a></div></section>`;
const app=document.getElementById('app');const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.1});
function route(){const raw=(location.hash||'#/').slice(1),[path,q]=raw.split('?');let html;
if(path.startsWith('/services/'))html=svcPage(path.split('/')[2]);else html=(P[path]||notFound)();
app.innerHTML=html;document.getElementById('nav').innerHTML=nav();document.getElementById('nav').classList.remove('open');window.scrollTo(0,0);
if(!path.startsWith('/services/'))document.title=(path==='/'?'PrimeIndex Research & Analytics':path.slice(1).replace(/-/g,' ').replace(/^./,c=>c.toUpperCase())+' | PrimeIndex');
document.querySelectorAll('section .flip,section .card,.steps li,.ni').forEach(el=>{el.classList.add('rv');io.observe(el)});bind(path,q)}
const bad=(f,m)=>{const x=f.nextElementSibling||f;(x.className==='err'?x:f.parentElement.querySelector('.err')).textContent=m;return 1};
function check(form){let n=0;form.querySelectorAll('.err').forEach(x=>x.textContent='');
form.querySelectorAll('input,textarea').forEach(f=>{if(f.type==='checkbox'){if(!f.checked)n+=bad(f,'Please confirm to continue.')}else if(f.dataset.o!=='1'&&!f.value.trim())n+=bad(f,'This field is required.');else if(f.type==='email'&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.value))n+=bad(f,'Enter a valid email address.')});
const first=form.querySelector('.err:not(:empty)');if(first)first.parentElement.querySelector('input,textarea')?.focus();return !n}
const rid=()=>'PI-'+new Date().getFullYear()+'-'+Date.now().toString(36).slice(-5).toUpperCase();
async function save(col,id,data){const m={subscribers:'subscribe',enquiries:'contact'}[col];const r=await fetch('/api/'+m,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw 0;return r.json()}
function done(box,msg){box.innerHTML=`<div class="ok" role="status">${msg}</div>`;box.scrollIntoView({block:'center'})}
function bind(path,q){
const nl=document.getElementById('nl');if(nl)nl.onsubmit=async ev=>{ev.preventDefault();const f=ev.target;if(!check(f))return;try{await save('subscribers',rid(),{email:f.em.value.trim(),consent:true});done(f.parentElement,'<h3>Subscribed</h3>Thank you. You can unsubscribe at any time.')}catch(x){document.getElementById('nle').textContent='Subscriptions need a signed-in session. Please email us instead.'}};
const ct=document.getElementById('ct');if(ct)ct.onsubmit=async ev=>{ev.preventDefault();if(!check(ct))return;const b=ct.querySelector('button');b.disabled=true;b.textContent='Sending…';const d=Object.fromEntries(new FormData(ct));delete d.consent;
try{await save('enquiries',rid(),d);done(document.getElementById('cf'),'<h3>Message received</h3>Thank you. We will reply by email.')}catch(x){b.disabled=false;b.textContent='Send message';window.open(`https://wa.me/${WA}?text=${encodeURIComponent('Enquiry from '+d.name+': '+d.subject+' - '+d.message)}`);}};
const rq=document.getElementById('rq');if(rq){const cat=rq.cat,sv=rq.svc;const fill=()=>{sv.innerHTML=S.find(s=>s.id===cat.value).dl.map(x=>`<option>${x}</option>`).join('')};const pre=new URLSearchParams(q||'').get('s');if(pre)cat.value=pre;cat.onchange=fill;fill();
rq.onsubmit=async ev=>{ev.preventDefault();if(!check(rq))return;const b=rq.querySelector('button');b.disabled=true;b.textContent='Submitting…';const d=Object.fromEntries(new FormData(rq));delete d.acc;delete d.consent;try{const r=await fetch('/api/requests',{method:'POST',body:new FormData(rq)});if(!r.ok)throw 0;const j=await r.json(),id=j.ref;done(document.getElementById('rf'),`<h3>Request received</h3><div class="ref">${id}</div><p>Keep this reference. We will review and reply. Submission is not acceptance.</p>${j.failed?`<p style="color:#c0392b"><b>${j.failed} file(s) could not be uploaded.</b> Please send them on WhatsApp with this reference.</p>`:''}<a class="btn" href="https://wa.me/${WA}?text=${encodeURIComponent('Hello, my request reference is '+id)}">Send files on WhatsApp</a>`)}
catch(x){b.disabled=false;b.textContent='Submit request';done(document.getElementById('rf'),`<h3>One more step</h3><p>We could not save your request online from this session. Send it to us on WhatsApp so it is not lost.</p><a class="btn" href="https://wa.me/${WA}?text=${encodeURIComponent('Service request: '+d.name+', '+d.cat+', '+d.title+'. '+d.desc)}">Send on WhatsApp</a>`)}}}
if(path==='/insights')fetch('/api/posts').then(r=>r.json()).then(p=>{if(p.length)document.getElementById('posts').innerHTML=p.map(x=>`<article class="card" style="margin-bottom:14px"><h3>${e(x.title)}</h3><small>${new Date(x.publishAt).toLocaleDateString()} · ${e(x.category)}</small><p style="white-space:pre-wrap">${e(x.body)}</p></article>`).join('')}).catch(()=>{})}
function admin(){const box=document.getElementById('ad');if(!db||!(user&&user.canEdit())){box.innerHTML='<div class="empty">This area is for PrimeIndex administrators. Sign in with an administrator account to continue.</div>';return}
box.innerHTML='<h2>Requests</h2><div id="rl" class="card" style="overflow:auto"></div><h2 style="margin-top:34px">Enquiries</h2><div id="el" class="card" style="overflow:auto"></div><h2 style="margin-top:34px">Subscribers</h2><div id="sl" class="card"></div>';
const lst=(col,el,fn)=>db.collection(col).orderBy('created','desc').limit(100).onSnapshot(s=>{el.innerHTML=s.docs.length?fn(s.docs):'<div class="empty">Nothing here yet.</div>'},()=>{el.textContent='Could not load.'});
window.upd=(id,f,v)=>db.collection('requests').doc(id).update({[f]:v});
lst('requests',document.getElementById('rl'),ds=>`<table><tr><th>Ref</th><th>Client</th><th>Service</th><th>Status</th><th>Quote</th><th>Notes</th></tr>${ds.map(x=>{const d=x.data();return `<tr><td><b>${e(d.ref||x.id)}</b><br>${new Date(d.created).toLocaleDateString()}</td><td>${e(d.name)}<br>${e(d.email)}<br>${e(d.phone)}</td><td>${e(d.svc)}<br><i>${e(d.title)}</i><br>Due ${e(d.deadline)}<br>${e(d.desc)}</td><td><select onchange="upd('${x.id}','status',this.value)">${ST.map(s=>`<option${s===d.status?' selected':''}>${s}</option>`).join('')}</select></td><td><input value="${e(d.quote)}" placeholder="₦ amount" onchange="upd('${x.id}','quote',this.value)"></td><td><input value="${e(d.notes)}" placeholder="Internal note" onchange="upd('${x.id}','notes',this.value)"></td></tr>`}).join('')}</table>`);
lst('enquiries',document.getElementById('el'),ds=>`<table>${ds.map(x=>{const d=x.data();return `<tr><td>${e(d.name)}<br>${e(d.email)}</td><td><b>${e(d.subject)}</b><br>${e(d.message)}</td></tr>`}).join('')}</table>`);
lst('subscribers',document.getElementById('sl'),ds=>ds.map(x=>e(x.data().email)).join('<br>'))}
const mt=document.getElementById('mt'),nv=document.getElementById('nav');mt.onclick=()=>mt.setAttribute('aria-expanded',nv.classList.toggle('open'));
addEventListener('hashchange',route);route();
</script></body></html>
